name: Verify and build QF revision

on:
  push:
    paths:
      - '.github/workflows/build_revision_outputs_v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qf-major-revision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Reproduce outputs and verify
        run: |
          rm -rf RESULTS
          python run_calibration.py
          python run_primary_gmv.py
          python semantic_checks.py
          python supplement_diagnostics.py
          python population_map_check.py
          pytest -q
      - name: Prepare revision tree
        run: |
          rm -f RESULTS.zip
          zip -qr RESULTS.zip RESULTS
          rm -rf .payload
          rm -f aiq_cov.py aiq_mvo.py aiq_sr_tests.py defaults.py
          rm -f diq_mvo.py diq_mvo_optimizer.py diq_mvo_performance.py diq_mvo_trans_cost.py
          rm -f gs_sre_optuna.py postprocess_portfolio_diagnostics.py ranking_performance.py run_atomic_iq.py
          rm -f prices_multi_asset_master.csv DGS3MO_monthly_rf.csv
          rm -f .github/workflows/build_revision_outputs.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          find . -type f ! -path './.git/*' ! -name 'SHA256_MANIFEST.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256_MANIFEST.txt
      - name: Commit verified revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reproduce and verify QF major revision" || exit 0
          git push origin HEAD:qf-major-revision
