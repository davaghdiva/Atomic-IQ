name: Build QF revision outputs

on:
  push:
    paths:
      - '.github/workflows/build_revision_outputs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qf-major-revision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reproduce calibration and GMV outputs
        run: |
          python run_calibration.py
          python run_primary_gmv.py
          python semantic_checks.py
          python supplement_diagnostics.py
          python population_map_check.py
          pytest -q
      - name: Prepare public revision tree
        run: |
          rm -f RESULTS.zip
          zip -qr RESULTS.zip RESULTS
          rm -rf .payload
          rm -f aiq_cov.py aiq_mvo.py aiq_sr_tests.py defaults.py
          rm -f diq_mvo.py diq_mvo_optimizer.py diq_mvo_performance.py diq_mvo_trans_cost.py
          rm -f gs_sre_optuna.py postprocess_portfolio_diagnostics.py ranking_performance.py run_atomic_iq.py
          rm -f prices_multi_asset_master.csv DGS3MO_monthly_rf.csv
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .venv
          find . -type f ! -path './.git/*' ! -name 'SHA256_MANIFEST.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256_MANIFEST.txt
      - name: Commit reproduced outputs and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reproduce frozen outputs for QF major revision" || exit 0
          git push origin HEAD:qf-major-revision
